<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Book Reader</title>
<style>
:root{--bg:#f2f2f7;--fg:#000;--mut:#8e8e93;--card:#fff;--acc:#007aff;--bar:rgba(249,249,249,.8);--sep:rgba(60,60,67,.18);--sh:rgba(0,0,0,.28);--on:#fff;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
:root[data-theme="sepia"]{--bg:#efe4cc;--fg:#3b2a14;--mut:#8a7650;--card:#f8f0dc;--acc:#a0522d;--bar:rgba(239,228,204,.82);--sep:rgba(90,60,20,.2)}
:root[data-theme="dark"]{--bg:#000;--fg:#fff;--mut:#8e8e93;--card:#1c1c1e;--acc:#0a84ff;--bar:rgba(28,28,30,.8);--sep:rgba(84,84,88,.5);--sh:rgba(0,0,0,.9)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
header,footer{display:grid;align-items:center;padding:8px 14px;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);z-index:3}
header{padding-top:calc(8px + var(--sat));grid-template-columns:1fr auto 1fr;border-bottom:.5px solid var(--sep)}
footer{padding-bottom:calc(8px + var(--sab));grid-template-columns:auto 1fr auto auto;gap:10px;border-top:.5px solid var(--sep);display:none}
h1{font-size:1.02rem;font-weight:600;margin:0;max-width:52vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic{justify-self:end;display:flex;gap:2px}
button{font:inherit;font-size:1.02rem;background:none;color:var(--acc);border:0;padding:8px 10px;cursor:pointer;border-radius:10px;-webkit-tap-highlight-color:transparent}
button:active{opacity:.4}
button:disabled{opacity:.3}
.tb{justify-self:start;padding-left:2px}
button svg{width:22px;height:22px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#snd.off{opacity:.4}
body.lib h1,body.lib #home,body.lib #snd,body.lib #fs{visibility:hidden}
main{flex:1;min-height:0;position:relative;overflow:auto}
#lib{padding:4px 18px calc(40px + var(--sab));max-width:900px;margin:0 auto}
.lt{display:flex;align-items:center;justify-content:space-between;margin:6px 0 4px}
.lt h2{font-size:2.1rem;font-weight:700;margin:0;letter-spacing:-.02em}
#pick{background:var(--acc);color:var(--on);font-weight:600;font-size:.95rem;padding:8px 16px;border-radius:999px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:18px;margin-top:18px}
.card{background:var(--card);border-radius:14px;padding:8px;position:relative;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;display:block;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.card b{display:block;font-size:.82rem;font-weight:600;margin-top:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card small{color:var(--mut);font-size:.72rem}
.card i{position:absolute;top:-6px;right:-6px;font-style:normal;background:#ff3b30;color:#fff;border-radius:50%;width:22px;height:22px;line-height:21px;text-align:center;font-size:.95rem;box-shadow:0 1px 4px rgba(0,0,0,.3)}
#empty{text-align:center;color:var(--mut);padding:70px 10px;font-size:1rem;line-height:1.5}
#book{display:none;height:100%}
#stage{touch-action:none;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.stf__parent{filter:drop-shadow(0 14px 24px var(--sh))}
.page{background:#fff}
.page canvas{width:100%;height:100%;display:block}
#ld{display:none;position:absolute;inset:0;background:var(--bg);align-items:center;justify-content:center;flex-direction:column;color:var(--mut);z-index:5}
#bar{width:200px;height:4px;background:var(--sep);border-radius:2px;margin-top:14px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--acc)}
#sl{accent-color:var(--acc);width:100%}
#pg{min-width:70px;text-align:center;color:var(--mut);font-size:.8rem;font-variant-numeric:tabular-nums}
#pv,#nx{font-size:1.7rem;line-height:1;padding:4px 12px}
body.focus header,body.focus footer{display:none!important}
body.focus main{padding-top:var(--sat);padding-bottom:var(--sab);box-sizing:border-box}
#ex{display:none;position:fixed;top:calc(8px + var(--sat));right:10px;z-index:9;width:36px;height:36px;padding:0;border-radius:50%;background:var(--bar);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--fg);font-size:1rem;opacity:.75;box-shadow:0 1px 6px rgba(0,0,0,.25)}
body.focus #ex{display:block}
footer{grid-template-columns:auto 1fr auto auto auto auto!important}
#zv{display:none;position:fixed;inset:0;z-index:20;background:var(--bg);flex-direction:column}
#zv.on{display:flex}
#zt,#zb{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px)}
#zt{padding-top:calc(8px + var(--sat));border-bottom:.5px solid var(--sep)}
#zb{padding-bottom:calc(8px + var(--sab));border-top:.5px solid var(--sep);justify-content:space-around;gap:4px}
#zs{flex:1;overflow:auto;touch-action:none;position:relative;background:var(--sep)}
#zw{position:relative;margin:0 auto}
#zc{width:100%;display:block;background:#fff}
#zh{position:absolute;inset:0}
.hb{position:absolute;mix-blend-mode:multiply;opacity:.6;border-radius:2px}
#zv button.tg{border:1px solid var(--acc);border-radius:999px;padding:7px 14px;font-size:.92rem}
#zv button.tg.on{background:var(--acc);color:var(--on)}
#zcol{width:34px;height:34px;padding:0;border-radius:50%;background:var(--dot,#ffe14d);border:2px solid var(--card);box-shadow:0 0 0 1px var(--mut)}
#hs{display:none;position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.4)}
#hs.on{display:flex;align-items:flex-end}
#hsh{background:var(--bg);width:100%;max-height:78%;border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding-bottom:var(--sab)}
#hsh .t{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;font-weight:600}
#hg{overflow:auto;padding:4px 14px 18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.ht{background:var(--card);border-radius:12px;padding:6px;position:relative;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ht img{width:100%;border-radius:8px;display:block;background:#fff}
.ht small{color:var(--mut);font-size:.72rem}
.ht i{position:absolute;top:-6px;right:-6px;font-style:normal;background:#ff3b30;color:#fff;border-radius:50%;width:22px;height:22px;line-height:21px;text-align:center}
body.rd header,body.rd footer{background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none;border-color:transparent}
</style>
</head>
<body>
<header>
  <button class="tb" id="home">‹ Library</button>
  <h1 id="title">Library</h1>
  <span class="ic"><button id="snd" aria-label="Sound"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg></button><button id="th" aria-label="Theme"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17" /><path d="M12 3.5a8.5 8.5 0 010 17z" fill="currentColor"/></svg></button><button id="fs" aria-label="Fullscreen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button></span>
</header>
<main>
  <div id="lib">
    <div class="lt"><h2>Library</h2><button id="pick">＋ Add PDF</button></div><input type="file" id="file" accept="application/pdf" hidden>
    <div id="grid"></div>
    <div id="empty">📚<br><b>No Books Yet</b><br>Tap “Add PDF” to start reading.<br>Books are saved on this device for offline use.</div>
  </div>
  <div id="book"><div id="stage"><div id="flip"></div></div></div>
  <div id="ld"><div id="lm">Opening…</div><div id="bar"><i></i></div></div>
</main>
<button id="ex" aria-label="Exit full screen">✕</button>
<footer id="foot">
  <button id="pv">‹</button>
  <input type="range" id="sl" min="1" max="1" value="1">
  <span id="pg"></span>
  <button id="zm" aria-label="Zoom"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5M8.5 11h5M11 8.5v5"/></svg></button>
  <button id="hlb" aria-label="Highlights"><svg viewBox="0 0 24 24"><path d="M4 20l1-4 11-11 3 3L8 19z"/><path d="M14 7l3 3"/></svg></button>
  <button id="nx">›</button>
</footer>
<div id="zv">
  <div id="zt"><button id="zx">✕ Close</button><b id="zp">Page</b><button id="zl">Highlights</button></div>
  <div id="zs"><div id="zw"><canvas id="zc"></canvas><div id="zh"></div></div></div>
  <div id="zb"><button class="tg" id="zd">Highlight</button><button id="zcol" aria-label="Color"></button><button id="zu">Undo</button><button id="zmn">−</button><button id="zpl">+</button></div>
</div>
<div id="hs"><div id="hsh"><div class="t"><span>Highlights</span><button id="hsx">Done</button></div><div id="hg"></div></div></div>
<script src="pdf.min.js"></script>
<script src="page-flip.browser.js"></script>
<script>
const $=id=>document.getElementById(id);
pdfjsLib.GlobalWorkerOptions.workerSrc="pdf.worker.min.js";
/* ---------- storage ---------- */
const DB=new Promise((ok,no)=>{const r=indexedDB.open("bookreader",1);r.onupgradeneeded=()=>{r.result.createObjectStore("meta",{keyPath:"id"});r.result.createObjectStore("data")};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const rq=(s,m,f)=>DB.then(d=>new Promise((ok,no)=>{const t=d.transaction(s,m),r=f(t.objectStore(s));t.oncomplete=()=>ok(r.result);t.onerror=()=>no(t.error)}));
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}};
/* ---------- theme / sound / fullscreen ---------- */
const themes=["light","sepia","dark"];let ti=Math.max(0,themes.indexOf(ls("theme")));
function bars(){try{if(window.NativeBars){const r=document.documentElement.style;r.setProperty("--sat",NativeBars.top()+"px");r.setProperty("--sab",NativeBars.bottom()+"px");NativeBars.light(themes[ti]!=="dark")}}catch(e){}}
const applyTheme=()=>{document.documentElement.dataset.theme=themes[ti];ls("theme",themes[ti]);bars()};applyTheme();
[300,1200,3000].forEach(t=>setTimeout(bars,t));addEventListener("resize",bars);
$("th").onclick=()=>{ti=(ti+1)%3;applyTheme()};
let muted=ls("muted")==="1";$("snd").classList.toggle("off",muted);
$("snd").onclick=()=>{muted=!muted;ls("muted",muted?"1":"0");$("snd").classList.toggle("off",muted)};
function setFocus(on,push){document.body.classList.toggle("focus",on);if(on&&push)history.pushState({r:2},"");setTimeout(()=>{if(cur&&flip)build(flip.getCurrentPageIndex())},250)}
$("fs").onclick=()=>setFocus(true,true);
$("ex").onclick=()=>history.back();
addEventListener("popstate",()=>{if($("zv").classList.contains("on")){$("zv").classList.remove("on");return}if(document.body.classList.contains("focus"))setFocus(false,false);else if(cur)showLib()});
let ac;function snd(){if(muted)return;try{ac=ac||new AudioContext();const n=ac.sampleRate*.2,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3)*.3;const s=ac.createBufferSource();s.buffer=b;const f=ac.createBiquadFilter();f.type="highpass";f.frequency.value=1800;s.connect(f).connect(ac.destination);s.start()}catch(e){}}
/* ---------- library ---------- */
async function showLib(){
  kill();cur=null;
  document.body.className="lib";$("book").style.display="none";$("foot").style.display="none";$("lib").style.display="block";$("title").textContent="Library";
  const all=(await rq("meta","readonly",s=>s.getAll())).sort((a,b)=>b.time-a.time);
  $("empty").style.display=all.length?"none":"block";
  $("grid").innerHTML="";
  all.forEach(m=>{
    const c=document.createElement("div");c.className="card";
    c.innerHTML='<img alt=""><b></b><small></small><i>×</i>';
    c.querySelector("img").src=m.cover;c.querySelector("b").textContent=m.name;
    c.querySelector("small").textContent="Page "+(m.page+1)+" of "+m.n;
    c.onclick=async e=>{
      if(e.target.tagName==="I"){if(confirm("Remove this book from the device?")){await rq("meta","readwrite",s=>s.delete(m.id));await rq("data","readwrite",s=>s.delete(m.id));showLib()}return}
      const buf=await rq("data","readonly",s=>s.get(m.id));openBook(buf,m)};
    $("grid").appendChild(c);
  });
}
$("home").onclick=()=>{if(history.state&&history.state.r)history.back();else showLib()};
$("pick").onclick=()=>$("file").click();
$("file").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
  const buf=await f.arrayBuffer();
  const m={id:f.name+"|"+f.size+"|"+f.lastModified,name:f.name.replace(/\.pdf$/i,""),page:0,time:Date.now()};
  const old=await rq("meta","readonly",s=>s.get(m.id));
  if(old){openBook(buf,old);return}
  openBook(buf,m,true)};
/* ---------- reader ---------- */
let flip=null,cur=null,lock=false;
function go(next){if(lock||!flip)return;lock=true;next?flip.flipNext():flip.flipPrev();setTimeout(()=>{lock=false},800)}
function kill(){try{if(flip)flip.destroy()}catch(e){}flip=null}
const busy=(on,t)=>{$("ld").style.display=on?"flex":"none";if(t)$("lm").textContent=t};
async function openBook(buf,meta,isNew){
  busy(true,"Opening…");$("bar").firstElementChild.style.width="30%";
  try{
    const pdf=await pdfjsLib.getDocument({data:buf.slice(0)}).promise;
    meta.n=pdf.numPages;
    if(isNew||!meta.cover){
      const p=await pdf.getPage(1),v=p.getViewport({scale:1}),sc=240/v.width,vv=p.getViewport({scale:sc}),c=document.createElement("canvas");
      c.width=vv.width;c.height=vv.height;await p.render({canvasContext:c.getContext("2d"),viewport:vv}).promise;
      meta.cover=c.toDataURL("image/jpeg",.7);
      await rq("data","readwrite",s=>s.put(buf,meta.id));
    }
    meta.time=Date.now();await rq("meta","readwrite",s=>s.put(meta));
    const p1=await pdf.getPage(1),b=p1.getViewport({scale:1});
    cur={pdf,meta,w:b.width,h:b.height,buf};
    document.body.className="rd";history.pushState({r:1},"");$("lib").style.display="none";$("book").style.display="block";$("foot").style.display="grid";$("title").textContent=meta.name;
    busy(false);build(meta.page||0);
  }catch(e){console.error(e);busy(true,"Couldn’t open this book: "+((e&&e.message)||e));$("bar").firstElementChild.style.width="0";setTimeout(()=>{busy(false);showLib()},3500)}
}
function build(startAt){
  kill();
  const {pdf,meta,w,h}=cur,n=meta.n,st=$("stage");
  const portrait=innerWidth<700||innerHeight>innerWidth,k=Math.min((st.clientWidth-4)/(portrait?w:w*2),(st.clientHeight-4)/h);
  const pw=Math.floor(w*k),ph=Math.floor(h*k),dpr=Math.min(devicePixelRatio||1,2);
  st.innerHTML='<div id="flip"></div>';const items=[],done=new Set();let q=Promise.resolve();
  for(let i=0;i<n;i++){const d=document.createElement("div");d.className="page";d.dataset.density=(i===0||i===n-1)?"hard":"soft";d.appendChild(document.createElement("canvas"));items.push(d)}
  const draw=i=>{if(i<0||i>=n||done.has(i))return;done.add(i);
    q=q.then(async()=>{const p=await pdf.getPage(i+1),sc=Math.min(3,pw*dpr/p.getViewport({scale:1}).width),v=p.getViewport({scale:sc}),c=items[i].firstChild;
      c.width=v.width;c.height=v.height;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);await p.render({canvasContext:x,viewport:v}).promise;const H=(cur.meta.hl||[]).filter(h=>h.p===i);if(H.length){x.globalCompositeOperation="multiply";H.forEach(h=>{x.fillStyle=h.c;x.fillRect(h.x*c.width,h.y*c.height,h.w*c.width,h.h*c.height)});x.globalCompositeOperation="source-over"}}).catch(()=>{})};
  const around=i=>{for(let j=i-2;j<=i+4;j++)draw(j)};cur.redraw=i=>{done.delete(i);draw(i)};
  flip=new St.PageFlip($("flip"),{width:pw,height:ph,size:"fixed",showCover:true,usePortrait:true,maxShadowOpacity:.5,mobileScrollSupport:false,useMouseEvents:false,flippingTime:750});
  flip.loadFromHTML(items);
  const sl=$("sl");sl.max=n;
  const upd=()=>{const i=flip.getCurrentPageIndex();sl.value=i+1;$("pg").textContent=(i+1)+" / "+n;$("pv").disabled=i<=0;$("nx").disabled=i>=n-1;around(i);meta.page=i;clearTimeout(upd.t);upd.t=setTimeout(()=>rq("meta","readwrite",s=>s.put(meta)),600)};
  flip.on("flip",upd);flip.on("changeState",e=>{if(e.data==="flipping")snd()});
  if(startAt>0)flip.turnToPage(Math.min(startAt,n-1));
  around(startAt);upd();
  sl.oninput=()=>{flip.turnToPage(+sl.value-1);upd()};
  $("pv").onclick=()=>go(false);$("nx").onclick=()=>go(true);
}
addEventListener("keydown",e=>{if(!flip)return;if(e.key==="ArrowRight")go(true);if(e.key==="ArrowLeft")go(false)});
let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{if(cur&&flip)build(flip.getCurrentPageIndex())},350)});
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
/* ---------- zoom + highlights ---------- */
const COL=["#ffe14d","#7ee08a","#ff8fb1","#7cc4ff"];let ci=0,zmode=false,zp=0,zz=1;
const hlist=()=>cur.meta.hl||(cur.meta.hl=[]);
const saveMeta=()=>rq("meta","readwrite",s=>s.put(cur.meta));
const zfit=()=>{$("zw").style.width=($("zs").clientWidth*zz)+"px"};
function drawHB(){const z=$("zh");z.innerHTML="";hlist().filter(h=>h.p===zp).forEach(h=>{const d=document.createElement("div");d.className="hb";Object.assign(d.style,{left:h.x*100+"%",top:h.y*100+"%",width:h.w*100+"%",height:h.h*100+"%",background:h.c});z.appendChild(d)})}
async function openZoom(p,rect){
  if(!cur)return;zp=p;history.pushState({r:3},"");$("zv").classList.add("on");$("zp").textContent="Page "+(p+1);
  const zs=$("zs"),c=$("zc"),dpr=Math.min(devicePixelRatio||1,2.5);
  const pg=await cur.pdf.getPage(p+1),b=pg.getViewport({scale:1}),v=pg.getViewport({scale:Math.min(2600,Math.round(zs.clientWidth*dpr*2.5))/b.width});
  c.width=v.width;c.height=v.height;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);
  await pg.render({canvasContext:x,viewport:v}).promise;
  zz=1;zfit();zs.scrollLeft=0;zs.scrollTop=0;drawHB();
  if(rect){zz=Math.min(5,Math.max(1,.85/rect.w));zfit();const w=$("zw");zs.scrollLeft=(rect.x+rect.w/2)*w.clientWidth-zs.clientWidth/2;zs.scrollTop=(rect.y+rect.h/2)*w.clientHeight-zs.clientHeight/2}
}
function zoomBy(f){const zs=$("zs"),w=$("zw"),cx=zs.clientWidth/2,cy=zs.clientHeight/2,fx=(zs.scrollLeft+cx)/w.clientWidth,fy=(zs.scrollTop+cy)/w.clientHeight;zz=Math.min(6,Math.max(1,zz*f));zfit();zs.scrollLeft=fx*w.clientWidth-cx;zs.scrollTop=fy*w.clientHeight-cy}
function addHL(r){
  const c=$("zc"),ar=(r.h*c.height)/(r.w*c.width);let tw=300,th=Math.round(tw*ar);if(th>420){th=420;tw=Math.round(th/ar)}
  const t=document.createElement("canvas");t.width=Math.max(20,tw);t.height=Math.max(12,th);const x=t.getContext("2d");
  x.drawImage(c,r.x*c.width,r.y*c.height,r.w*c.width,r.h*c.height,0,0,t.width,t.height);x.globalCompositeOperation="multiply";x.fillStyle=COL[ci];x.fillRect(0,0,t.width,t.height);
  hlist().push({id:Date.now(),p:zp,c:COL[ci],x:r.x,y:r.y,w:r.w,h:r.h,thumb:t.toDataURL("image/jpeg",.7)});
  saveMeta();drawHB();cur.redraw&&cur.redraw(zp)}
$("zx").onclick=()=>history.back();
$("zd").onclick=()=>{zmode=!zmode;$("zd").classList.toggle("on",zmode)};
$("zcol").onclick=()=>{ci=(ci+1)%COL.length;$("zcol").style.setProperty("--dot",COL[ci])};$("zcol").style.setProperty("--dot",COL[0]);
$("zu").onclick=()=>{const a=hlist();for(let i=a.length-1;i>=0;i--)if(a[i].p===zp){a.splice(i,1);break}saveMeta();drawHB();cur.redraw&&cur.redraw(zp)};
$("zmn").onclick=()=>zoomBy(.8);$("zpl").onclick=()=>zoomBy(1.25);
$("zm").onclick=()=>{if(flip)openZoom(flip.getCurrentPageIndex())};
$("zl").onclick=()=>openSheet();$("hlb").onclick=()=>openSheet();
function openSheet(){
  const g=$("hg"),a=hlist().slice().sort((u,v)=>u.p-v.p||u.y-v.y);g.innerHTML="";
  $("hs").classList.add("on");

(()=>{const zs=$("zs");let mode=null,sx=0,sy=0,sl=0,sto=0,d0=1,z0=1,tmp=null,last=0,moved=false;

  if(e.touches.length===2){mode="pinch";d0=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)||1;z0=zz;if(tmp){tmp.remove();tmp=null}return}

  if(mode==="pinch"&&e.touches.length===2){const A=e.touches[0],B=e.touches[1],d=Math.hypot(A.clientX-B.clientX,A.clientY-B.clientY),rc=zs.getBoundingClientRect(),cx=(A.clientX+B.clientX)/2-rc.left,cy=(A.clientY+B.clientY)/2-rc.top,w=$("zw"),fx=(zs.scrollLeft+cx)/w.clientWidth,fy=(zs.scrollTop+cy)/w.clientHeight;
   zz=Math.min(6,Math.max(1,z0*d/d0));zfit();zs.scrollLeft=fx*w.clientWidth-cx;zs.scrollTop=fy*w.clientHeight-cy;return}
  const t=e.touches[0];if(Math.abs(t.clientX-sx)+Math.abs(t.clientY-sy)>6)moved=true;
  if(mode==="pan"){zs.scrollLeft=sl-(t.clientX-sx);zs.scrollTop=sto-(t.clientY-sy)}
  else if(mode==="draw"&&tmp){const[a,b]=pt(t),x0=+tmp.dataset.a,y0=+tmp.dataset.b;Object.assign(tmp.style,{left:Math.min(a,x0)*100+"%",top:Math.min(b,y0)*100+"%",width:Math.abs(a-x0)*100+"%",height:Math.abs(b-y0)*100+"%"})}
 },{passive:false});
 zs.addEventListener("touchend",e=>{

   const x=Math.max(0,Math.min(a,x0)),y=Math.max(0,Math.min(b,y0)),r={x,y,w:Math.min(1-x,Math.abs(a-x0)),h:Math.min(1-y,Math.abs(b-y0))},w=$("zw");
